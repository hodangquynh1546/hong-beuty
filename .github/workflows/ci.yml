name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore HongBeautyAPI/HongBeauty.slnx
      - run: dotnet build HongBeautyAPI/HongBeauty.slnx --no-restore --configuration Release
      - run: dotnet test HongBeautyAPI/HongBeauty.slnx --no-build --configuration Release
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HongBeautyUI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: HongBeautyUI/package-lock.json
      - run: npm ci
      - run: npm run build
