services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: ${ConnectionStrings__Default:?set ConnectionStrings__Default}
      AccountEmail__SmtpHost: ${AccountEmail__SmtpHost:-}
      AccountEmail__SmtpPort: ${AccountEmail__SmtpPort:-587}
      AccountEmail__From: ${AccountEmail__From:-}
      AccountEmail__BaseUrl: ${AccountEmail__BaseUrl:-}
      AccountEmail__SmtpUsername: ${AccountEmail__SmtpUsername:-}
      AccountEmail__SmtpPassword: ${AccountEmail__SmtpPassword:-}
      HONG_BEAUTY_BOOTSTRAP_ADMIN_EMAIL: ${HONG_BEAUTY_BOOTSTRAP_ADMIN_EMAIL:-}
      HONG_BEAUTY_BOOTSTRAP_ADMIN_PASSWORD: ${HONG_BEAUTY_BOOTSTRAP_ADMIN_PASSWORD:-}
      HONG_BEAUTY_BOOTSTRAP_ADMIN_FULL_NAME: ${HONG_BEAUTY_BOOTSTRAP_ADMIN_FULL_NAME:-}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
  migrate:
    build:
      context: .
      target: migrate
    environment:
      ConnectionStrings__Default: ${ConnectionStrings__Default:?set ConnectionStrings__Default}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
